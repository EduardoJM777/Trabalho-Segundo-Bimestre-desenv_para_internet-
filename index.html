<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Segundo Bimestre</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Identificador de Triângulos</h2>
    <label for="compA">Digite o primeiro comprimento:</label>
    <input 
        type="number"
        id="compA"
        name="compA"
        min="1"
        placeholder="Ex: 12">

    <br><br>

    <label for="compB">Digite o segundo comprimento:</label>
    <input 
        type="number"
        id="compB"
        name="compB"
        min="1"
        placeholder="Ex: 15">

    <br><br>    

    <label for="compC">Digite o terceiro comprimento:</label>
    <input 
        type="number" 
        name="compC"
        id="compC"
        min="1"
        placeholder="Ex: 18">

    <br><br>    

    <button id="btnVerif">Verificar</button>

    <p id="isTriang"></p>

    <p id="tipoTriangulo"></p>



    <br><br><br><br><br>



    <h2>Calculadora IMC</h2>
    <label for="peso">Insira seu peso (em kg):</label>
    <input 
        type="number"
        id="peso"
        name="peso"
        min="1"
        placeholder="Ex: 60">

    <br><br>
    
    <label for="altura">Insira sua altura (em m)</label>
    <input 
        type="number"
        id="altura"
        name="altura"
        min="0"
        step="0.01"
        placeholder="Ex: 1.70 ou 1,70">

    <br><br>

    <button id="calcIMC">Calcular IMC</button>

    <p id="resultIMC"></p>

    <p id="classifIMC"></p>



    <br><br><br><br><br>    



    <h2>Calculadora de Transferência de Veículo</h2>
    <label for="anoFab">Insira o ano de fabricação do veículo:</label>
    <input 
        type="number" 
        name="anoFab" 
        id="anoFab"
        min="1900"
        placeholder="Ex: 2002">

    <br><br>

    <label for="valorTabela">Insira o valor de tabela do veículo:</label>
    <input 
        type="number"
        id="valorTabela"
        name="valorTabela"
        min="1"
        placeholder="Ex: 8271,87 ou 8271.87">

    <br><br>

    <button id="calcTransf">Calcular valor da transferência</button>

    <p id="taxaCobrada"></p>

    <p id="valorCobrado"></p>



    <br><br><br><br><br> 









    
</body>
</html>
